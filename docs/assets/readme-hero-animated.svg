    <linearGradient id="h-shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="h-beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2B441" stop-opacity="0"/><stop offset="0.5" stop-color="#F2B441" stop-opacity="0.35"/><stop offset="1" stop-color="#F2B441" stop-opacity="0"/></linearGradient>
