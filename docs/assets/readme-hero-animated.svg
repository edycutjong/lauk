    <filter id="h-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <style>
    .drift-a { animation: drift-a 17s ease-in-out infinite alternate; }
    .drift-b { animation: drift-b 14s ease-in-out infinite alternate; }
    .pulse   { animation: pulse 8s ease-in-out infinite; }
    @keyframes drift-a { from { transform: translate(0, 0); } to { transform: translate(70px, 26px); } }
    @keyframes drift-b { from { transform: translate(0, 0); } to { transform: translate(-64px, -30px); } }
    @keyframes pulse   { 0%, 100% { opacity: 0.78; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

