<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Lauk — The bought plate's hollow pillars, terracotta outlines, fill amber the instant one cheap add lands.">
<!-- STORYBOARD (dur 8s — must equal this file's single master dur)
  0-10%   steady state: plate, grid, aurora; left: mini mark (filling + rich lit, three terracotta outlines), outlined wordmark Lau + k, tagline, metric line, tech line;
                        right: tile chip "Rice plate + one side", ceiling chip "≤ Rp 5k", the ring at 2 of 5, three cards cheapest first (poster rule: everything visible at t=0)
  10-24%  trigger:      a tap ring lands on card 2 (Raw veg + chili, Rp 2,000); its border turns amber; a chip detaches from the card's left edge and flies to the plate, landing below the count     data-story="beat-2"
  24-52%  mechanism:    The bought plate's hollow pillars, terracotta outlines, fill amber the instant one cheap add lands.                                     data-story="beat-3"
                        (landing ripple 26-36% · fresh sweeps 28-38% · bright sweeps 32-42% on the ring AND the mini mark · the count flips 2 of 5 → 4 of 5 at 40-42% · beam crosses 40-52%)
  52-82%  resolution:   four of five stay lit; the cue "Eat until satisfied, not until empty." fades in under the cards over a breathing bar; glow breath on the ring   data-story="beat-4"
  82-100% breathe + seam fade: chip, highlight, new fills, count, cue and bar fade out 90-97% (fully out before dur minus 100ms); outlines blend back; loop restarts on the poster
-->
